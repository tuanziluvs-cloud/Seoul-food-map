const done=JSON.parse(localStorage.getItem('seoulDoneV1')||'{}');
let selected=47;
function init(){ $('area').innerHTML='<option value="">全部地区（50家）</option>'+Object.keys(ROUTES).map(x=>`<option>${x}</option>`).join(''); $('kind').innerHTML='<option value="">全部类型</option>'+[...new Set(P.map(p=>p.kind))].map(x=>`<option>${x}</option>`).join(''); ['q','area','kind'].forEach(x=>$(x).addEventListener(x==='q'?'input':'change',render)); $('reset').onclick=()=>{$('q').value='';$('area').value='';$('kind').value='';render()};$('route').onclick=openRoute;$('export').onclick=exportCSV;show(P.find(p=>p.id===50));render()}
function filtered(){let a=$('area').value,k=$('kind').value,q=$('q').value.toLowerCase().trim();return P.filter(p=>(!a||p.area===a)&&(!k||p.kind===k)&&(!q||Object.values(p).join(' ').toLowerCase().includes(q))).sort((x,y)=>{if(a)return ROUTES[a].indexOf(x.id)-ROUTES[a].indexOf(y.id);return x.id-y.id})}
function render(){let ps=filtered();$('stats').textContent=`显示 ${ps.length} / 47 家 · 已打卡 ${Object.values(done).filter(Boolean).length} 家`;let a=$('area').value;$('routeInfo').innerHTML=a?`<strong>${a}</strong> · 建议按列表顺序逛。路线规划会跳过未确认门牌的店，分段导航更准确。`:'<strong>使用方法：</strong>先选择地区，再点「打开当前地区步行路线」；也可以单独点击每家店导航。';$('places').innerHTML=ps.map(p=>`<div class="place ${selected===p.id?'selected':''}"><input class="done" type="checkbox" data-done="${p.id}" ${done[p.id]?'checked':''} title="标记已打卡"><div class="body"><h3>#${p.id} ${esc(p.name)}</h3><div class="sub">${esc(p.ko)} · <span class="tag">${esc(p.kind)}</span>${p.status!=='ok'?'<span class="tag warn">'+(p.status==='branch'?'分店待定':p.status==='approx'?'位置仅供参考':'门牌待核')+'</span>':''}<br>${esc(p.address||p.area)}<br>${esc(p.note)}</div><div class="actions"><button data-show="${p.id}">📍地图预览</button><a class="btn secondary" href="${gm(p)}" target="_blank" rel="noopener">Google</a><a class="btn secondary" href="${nv(p)}" target="_blank" rel="noopener">Naver</a><a class="btn secondary" href="${walk(p)}" target="_blank" rel="noopener">步行</a></div></div></div>`).join('');document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>show(P.find(p=>p.id===+b.dataset.show)));document.querySelectorAll('[data-done]').forEach(b=>b.onchange=()=>{done[b.dataset.done]=b.checked;localStorage.setItem('seoulDoneV1',JSON.stringify(done));render()})}
function show(p){selected=p.id;$('mapTitle').textContent=`#${p.id} ${p.name}`;$('mapSub').textContent=(p.address||'门牌未确认：按韩文店名搜索')+' · '+p.note;$('gmap').href=gm(p);$('naver').href=nv(p);$('walk').href=walk(p);$('map').src='https://maps.google.com/maps?q='+enc(loc(p))+'&output=embed';render()}
function openRoute(){let a=$('area').value;if(!a){alert('请先选择一个地区');return}let ps=ROUTES[a].map(i=>P.find(p=>p.id===i)).filter(p=>p.address);if(ps.length<2){alert('此地区已核实门牌的地点不足两家，请单独使用地图搜索按钮。');return}if(ps.length>9){ps=ps.slice(0,9);alert('此地区地点较多，本次先导航前9家有门牌的店。可再单独选择后续地点导航。')}let origin=loc(ps[0]),dest=loc(ps[ps.length-1]),via=ps.slice(1,-1).map(loc).join('|');let url='https://www.google.com/maps/dir/?api=1&origin='+enc(origin)+'&destination='+enc(dest)+'&travelmode=walking'+(via?'&waypoints='+enc(via):'');window.open(url,'_blank','noopener')}
function exportCSV(){let rows=[['编号','店名','韩文','地区','类型','地址','备注','核实状态','已打卡'],...P.map(p=>[p.id,p.name,p.ko,p.area,p.kind,p.address,p.note,p.status,done[p.id]?'是':'否'])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='首尔打卡50家.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
init();
</script></body></html>
